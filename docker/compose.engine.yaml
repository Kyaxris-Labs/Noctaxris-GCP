# Compatibility overlay: nested DinD is already in default compose.yaml.
# Older docs/commands that use
#   docker compose -f compose.yaml -f compose.engine.yaml ...
# should merge cleanly. Do not redeclare noctaxris-gcp-engine here (duplicate
# security_opt entries fail Compose validation against the base file).
#
# Prefer plain:
#   docker compose -f compose.yaml --env-file .env up --build
#
# If nested containers fail to start on your host, also add:
#   -f compose.engine-privileged.yaml
#
# Never mount host docker.sock. Engine TLS listens on the Compose network only
# (no host publish of 2375/2376).
#
# Nested SQL / Kafka / Redis / GKE lab containers are created inside the engine
# on the shared bridge noctaxris-gcp-lab (API-managed; not a Compose network).
# Broker and DB ports are not published to the operator host.

services:
  noctaxris-gcp:
    environment:
      NOCTAXRIS_GCP_DOCKER_HOST: "tcp://noctaxris-gcp-engine:2376"
      NOCTAXRIS_GCP_DOCKER_CERT_PATH: "/certs/client"
      NOCTAXRIS_GCP_NESTED_ENGINE_FAIL_CLOSED: "1"
      NOCTAXRIS_GCP_NESTED_INVOKE_FAIL_CLOSED: "1"
    volumes:
      - noctaxris-gcp-engine-certs:/certs:ro
    depends_on:
      noctaxris-gcp-engine:
        condition: service_healthy
