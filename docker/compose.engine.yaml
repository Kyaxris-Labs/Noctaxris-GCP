# Compatibility overlay: nested DinD is now in default compose.yaml.
# Keeping this file so older docs/commands that use
#   docker compose -f compose.yaml -f compose.engine.yaml ...
# still merge cleanly (same engine wiring + fail-closed envs).
#
# Prefer plain:
#   docker compose -f compose.yaml --env-file .env up --build
#
# If nested containers fail to start on your host, also add:
#   -f compose.engine-privileged.yaml
#
# Never mount host docker.sock. Engine TLS listens on the Compose network only
# (no host publish of 2375/2376). Restricted DinD: privileged: false + caps.
#
# Nested SQL / Kafka / Redis / GKE lab containers are created inside the engine
# on the shared bridge noctaxris-gcp-lab (API-managed; not a Compose network).
# Broker and DB ports are not published to the operator host.

services:
  noctaxris-gcp:
    environment:
      NOCTAXRIS_GCP_DOCKER_HOST: "tcp://noctaxris-gcp-engine:2376"
      NOCTAXRIS_GCP_DOCKER_CERT_PATH: "/certs/client"
      NOCTAXRIS_GCP_NESTED_ENGINE_FAIL_CLOSED: "1"
      NOCTAXRIS_GCP_NESTED_INVOKE_FAIL_CLOSED: "1"
    volumes:
      - noctaxris-gcp-engine-certs:/certs:ro
    depends_on:
      noctaxris-gcp-engine:
        condition: service_healthy
  noctaxris-gcp-engine:
    image: docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
    privileged: false
    cgroup: host
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
      - SYS_RESOURCE
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
      - systempaths=unconfined
    devices:
      - /dev/fuse
    command: ["--ipv6=false", "--ip6tables=false"]
    environment:
      DOCKER_TLS_SAN: DNS:noctaxris-gcp-engine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - noctaxris-gcp-engine-certs:/certs
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s

volumes:
  noctaxris-gcp-engine-certs:
