services:
  noctaxris-gcp-init:
    image: busybox:1.36
    user: "0:0"
    volumes:
      - noctaxris-gcp-data:/data
      - noctaxris-gcp-secrets:/secrets
    # Named volumes are root-owned on first create; API runs as UID 65532 (distroless nonroot).
    command: ["sh", "-c", "chown -R 65532:65532 /data /secrets && chmod 700 /data /secrets"]
  noctaxris-gcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:4588:4588"
    environment:
      NOCTAXRIS_GCP_LISTEN: "0.0.0.0:4588"
      # Required for the container bind above. Default host publish is 127.0.0.1:4588.
      NOCTAXRIS_GCP_ALLOW_NONLOOPBACK_LISTEN: "1"
      NOCTAXRIS_GCP_DATA_ROOT: "/var/lib/noctaxris-gcp"
      # Sibling secrets volume (outside data root; required under read_only rootfs).
      NOCTAXRIS_GCP_MASTER_KEY_FILE: "/var/lib/noctaxris-gcp-secrets/master.key"
      NOCTAXRIS_GCP_ROOT_SERVICE_ACCOUNT: "${NOCTAXRIS_GCP_ROOT_SERVICE_ACCOUNT}"
      NOCTAXRIS_GCP_ROOT_ACCESS_TOKEN: "${NOCTAXRIS_GCP_ROOT_ACCESS_TOKEN}"
      NOCTAXRIS_GCP_PROJECT: "${NOCTAXRIS_GCP_PROJECT:-noctaxris-gcp-local}"
    volumes:
      - noctaxris-gcp-data:/var/lib/noctaxris-gcp
      - noctaxris-gcp-secrets:/var/lib/noctaxris-gcp-secrets
    # DO NOT add docker.sock
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      noctaxris-gcp-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/noctaxris-gcp", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  noctaxris-gcp-data:
  noctaxris-gcp-secrets:
