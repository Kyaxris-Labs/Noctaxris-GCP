name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./... -count=1
      - name: Race tests
        run: go test ./... -race -count=1

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        # Pin module version (not @latest) for supply-chain reproducibility.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        # Native govulncheck has no per-ID exclude. scripts/govulncheck-ci still
        # fails on any non-allowlisted finding; allowlist is empty unless a
        # residual with no module-path fix is documented (see
        # scripts/govulncheck-allowlist.txt and docs/security-defaults.md).
        run: go run ./scripts/govulncheck-ci
