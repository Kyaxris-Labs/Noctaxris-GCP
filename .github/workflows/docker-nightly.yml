name: docker-nightly

# Nightly Docker Hub publish (distinct from tag releases in release.yml).
on:
  schedule:
    # 03:47 UTC daily (offset from Noctaxris docker-nightly at 03:17).
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-nightly-${{ github.repository }}
  cancel-in-progress: false

env:
  IMAGE_NAME: kyaxris/noctaxris-gcp
  CANONICAL_REPO: Kyaxris-Labs/Noctaxris-GCP

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Gate (canonical repo + secrets)
        id: gate
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.repository }}" != "${CANONICAL_REPO}" ]; then
            echo "Skipping Docker Hub publish: not canonical repo (${{ github.repository }})."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are required." >&2
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Failing closed on workflow_dispatch (secrets missing)." >&2
            else
              echo "Failing closed on schedule (secrets missing)." >&2
            fi
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'

      - name: Set up Docker Buildx
        if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        if: steps.gate.outputs.publish == 'true'
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE_UTC=$(date -u +%Y%m%d)
          VERSION=$(tr -d '[:space:]' < VERSION)
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:nightly"
            echo "${IMAGE_NAME}:nightly-${DATE_UTC}"
            echo "${IMAGE_NAME}:sha-${SHORT_SHA}"
            echo "EOF"
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Noctaxris-GCP
            org.opencontainers.image.source=https://github.com/Kyaxris-Labs/Noctaxris-GCP
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
