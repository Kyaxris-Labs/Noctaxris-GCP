name: ci-required

# Required gates for release (and other callers). Failures must block Docker Hub publish.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or SHA to check out (tag, branch, or commit)
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./... -count=1

  compose-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compose static checks
        run: go test ./docker/ -count=1

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        # Pin module version (not @latest) for supply-chain reproducibility.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        # Native govulncheck has no per-ID exclude. scripts/govulncheck-ci still
        # fails on any non-allowlisted finding; allowlist is empty by default after
        # the moby client migration (see scripts/govulncheck-allowlist.txt and
        # docs/security-defaults.md).
        run: go run ./scripts/govulncheck-ci

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scoped race tests (kernel + store)
        run: go test ./internal/kernel/... ./internal/store/... -race -count=1 -timeout 30m

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Build API image
        run: docker build -f docker/Dockerfile .

  smoke-core:
    runs-on: ubuntu-latest
    needs: [unit, compose-static, image]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Prepare Compose env
        run: |
          set -euo pipefail
          cp docker/.env.example docker/.env
          ROOT_SA="root-ci-$(openssl rand -hex 4)@noctaxris-gcp-local.iam.gserviceaccount.com"
          ROOT_TOKEN="$(openssl rand -hex 32)"
          awk -v sa="$ROOT_SA" -v token="$ROOT_TOKEN" '
            /^NOCTAXRIS_GCP_ROOT_SERVICE_ACCOUNT=/ { print "NOCTAXRIS_GCP_ROOT_SERVICE_ACCOUNT=" sa; next }
            /^NOCTAXRIS_GCP_ROOT_ACCESS_TOKEN=/ { print "NOCTAXRIS_GCP_ROOT_ACCESS_TOKEN=" token; next }
            { print }
          ' docker/.env > docker/.env.tmp
          mv docker/.env.tmp docker/.env
          {
            echo "ROOT_SA=${ROOT_SA}"
            echo "ROOT_TOKEN=${ROOT_TOKEN}"
          } >> "$GITHUB_ENV"
      - name: Compose up
        run: docker compose -f docker/compose.yaml --env-file docker/.env up --build -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4588/_noctaxris-gcp/ready | grep -q ready; then
              echo "ready"
              exit 0
            fi
            sleep 5
          done
          echo "API never became ready" >&2
          docker compose -f docker/compose.yaml --env-file docker/.env logs --no-color || true
          exit 1
      - name: Core REST smoke (CRM / GCS / Secret Manager)
        env:
          EP: http://127.0.0.1:4588
          PROJECT: noctaxris-gcp-local
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${ROOT_TOKEN}"
          curl -fsS -H "$AUTH" "$EP/v3/projects/${PROJECT}" | grep -q "${PROJECT}"
          BUCKET="noctaxris-gcp-ci-$(date +%s)"
          curl -fsS -H "$AUTH" -H "Content-Type: application/json" \
            -X POST "$EP/storage/v1/b?project=${PROJECT}" \
            -d "{\"name\":\"${BUCKET}\"}" | grep -q "${BUCKET}"
          echo smoke-core > /tmp/smoke-core.txt
          curl -fsS -H "$AUTH" -H "Content-Type: text/plain" \
            -X POST "$EP/upload/storage/v1/b/${BUCKET}/o?uploadType=media&name=smoke.txt" \
            --data-binary @/tmp/smoke-core.txt >/dev/null
          curl -fsS -H "$AUTH" "$EP/storage/v1/b/${BUCKET}/o/smoke.txt" | grep -q smoke.txt
          SECRET="ci-secret-$(date +%s)"
          curl -fsS -H "$AUTH" -H "Content-Type: application/json" \
            -X POST "$EP/v1/projects/${PROJECT}/secrets?secretId=${SECRET}" \
            -d '{"replication":{"automatic":{}}}' | grep -q "${SECRET}"
          curl -fsS -H "$AUTH" -H "Content-Type: application/json" \
            -X POST "$EP/v1/projects/${PROJECT}/secrets/${SECRET}:addVersion" \
            -d '{"payload":{"data":"c21va2UtY29yZQ=="}}' | grep -q versions
      - name: Audit hygiene (root token absent)
        env:
          ROOT_TOKEN: ${{ env.ROOT_TOKEN }}
        run: |
          set -euo pipefail
          CID=$(docker compose -f docker/compose.yaml --env-file docker/.env ps -q noctaxris-gcp)
          docker run --rm --volumes-from "$CID" -e ROOT_TOKEN busybox \
            sh -c 'test -f /var/lib/noctaxris-gcp/audit/audit.jsonl && ! grep -Fq "$ROOT_TOKEN" /var/lib/noctaxris-gcp/audit/audit.jsonl'
      - name: Compose down
        if: always()
        run: docker compose -f docker/compose.yaml --env-file docker/.env down -v
